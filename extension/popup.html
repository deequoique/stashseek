<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>StashSeek Chat · 搜藏助手</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-brand">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <div>
          <p class="eyebrow">STASHSEEK CHAT</p>
          <p class="product-name">搜藏助手</p>
        </div>
        <span class="extension-label">CHROME</span>
      </header>

      <section class="popup-copy" aria-labelledby="popup-title">
        <p class="section-label">当前页面 · 视频字幕</p>
        <h1 id="popup-title">保存当前视频，<em>随后直接提问。</em></h1>
        <div class="status-panel" data-tone="loading">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="status" aria-live="polite">正在读取连接状态…</p>
        </div>
      </section>

      <div class="popup-actions">
        <form id="login-form" hidden>
          <label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required>
          <label for="code" hidden id="code-label">验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" hidden>
          <button id="login" type="submit">发送验证码</button>
        </form>
        <button id="primary" type="button" disabled>请稍候</button>
        <button id="workspace" class="quiet" type="button">与 Agent 对话</button>
        <button id="library" class="quiet" type="button">查看我的收藏</button>
        <button id="disconnect" class="quiet" type="button" hidden>退出登录</button>
      </div>

      <section id="library-panel" class="library-panel" hidden aria-live="polite"></section>

      <footer class="privacy">
        <strong>只取必要内容</strong>
        <span>只提交字幕和公开元数据，不上传登录状态或音视频。</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
