<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜藏助手 · PRD 原型</title><style>
:root{--ink:#232927;--muted:#68716c;--line:#d8ded7;--paper:#f5f6f1;--lime:#dff38e;--soft:#eef2e9}*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 12px;color:inherit}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #648548;outline-offset:2px}.primary{background:var(--lime);border-color:#c3d77c;font-weight:600}.primary:hover{background:#d3e97c}.quiet{border:0;background:transparent;padding:5px;color:var(--muted)}.danger{color:#a23f31}.top{padding:24px 32px 16px;border-bottom:1px solid var(--line);background:#fff}.top h1{font-size:24px;letter-spacing:-.5px;margin:0}.top p{margin:4px 0 0;color:var(--muted)}.workspace{max-width:1160px;margin:28px auto;display:grid;grid-template-columns:232px 1fr;gap:36px;padding:0 24px}.nav{display:flex;flex-direction:column;gap:5px}.nav .group{font-size:11px;letter-spacing:1px;color:var(--muted);margin-top:14px}.nav button{text-align:left;border:0;background:transparent;padding:8px 10px}.nav button.active{background:var(--lime);font-weight:600}.meta{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px}.stage{min-width:0}.browserbar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px}.dot{width:7px;height:7px;border-radius:50%;background:#bfc7bf}.frame{width:420px;max-width:100%;min-height:740px;background:#fff;border:1px solid #cbd3c9;border-radius:12px;box-shadow:0 14px 40px #243b2810;overflow:hidden;position:relative}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:650}.logo{background:var(--lime);width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:17px}.body{padding:18px 20px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h2{font-size:21px;line-height:1.4;margin:12px 0}h3{font-size:15px;line-height:1.5;margin:0 0 5px}p{margin:7px 0}.muted{color:var(--muted);font-size:12px}.small{font-size:12px}.current{background:var(--soft);padding:14px;border-radius:8px;margin-bottom:18px}.thumb{width:88px;height:62px;background:#e7e9e4;border:1px solid #d4d9d1;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#7d867d;font-size:12px;flex-shrink:0}.thumb.film{background:#e4e8dc}.fill{flex:1;min-width:0}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button{border:0;border-radius:0;background:transparent;padding:8px 0;color:var(--muted)}.tabs button.on{border-bottom:2px solid var(--ink);font-weight:650;color:var(--ink)}.search{display:flex;border:1px solid #b9c5b4;border-radius:8px;padding:4px;gap:4px;margin:12px 0}.search input{border:0;outline:0;min-width:0;flex:1;padding:7px;background:transparent;font-size:13px}.search button{padding:6px 10px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.chip{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;background:#fff;color:#5b675d}.chip.active{background:var(--soft);border-color:#9fae95}.item{padding:16px 0;border-bottom:1px solid var(--line)}.item:first-child{padding-top:5px}.item .flex.start{align-items:flex-start;flex-wrap:nowrap}.tag{background:var(--soft);font-size:11px;padding:2px 6px;border-radius:3px;display:inline-block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px}.status{font-size:12px;background:var(--soft);padding:10px 12px;border-radius:6px;margin:10px 0}.status.warn{background:#faf2df;color:#865b24}.status.error{background:#faeee9;color:#974d3b}.evidence{font-size:13px;padding:12px;border-left:3px solid #b3c79a;background:#f5f7f1;margin-top:10px}.evidence p{margin:4px 0}.line{border:0;border-top:1px solid var(--line);margin:18px 0}.empty{text-align:center;padding:46px 10px}.empty .symbol{font-size:34px;color:#96a18c}.field{display:block;margin:18px 0}.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}a{color:inherit}.footer{margin:22px 0 4px;text-align:center;color:var(--muted);font-size:12px}.poster{width:82px;height:112px;background:#e4e8dc;border:1px solid #cfd5c8;display:grid;place-items:center;font-size:12px;color:#75816d;border-radius:5px;flex-shrink:0}.back{margin-bottom:12px}.selection{padding:14px 0;border-bottom:1px solid var(--line)}.selection label{display:flex;gap:12px;align-items:center}.selection input{accent-color:#7b9848}.overlay{position:absolute;inset:0;background:#27322640;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#fff;width:100%;border-radius:10px;padding:22px;box-shadow:0 16px 50px #0002}.dialog h2{font-size:18px;margin-top:0}.reviewnote{max-width:420px;padding:14px 0;color:var(--muted);font-size:12px}.web{width:740px;min-height:740px}.webnav{padding:16px 20px;border-bottom:1px solid var(--line)}.webgrid{display:grid;grid-template-columns:160px 1fr}.webside{padding:20px;border-right:1px solid var(--line)}.webside button{display:block;border:0;background:none;margin-bottom:12px}.webmain{padding:20px;min-width:0}.upload{width:100%;height:150px;resize:vertical;border:1px solid var(--line);padding:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253328;color:#fff;padding:10px 18px;border-radius:8px;z-index:8;max-width:90%;font-size:13px}.notebar{border-top:1px solid var(--line);margin-top:18px;padding-top:12px;font-size:11px;color:var(--muted)}.atlas{padding:30px;display:grid;grid-template-columns:repeat(4,420px);gap:28px;background:var(--paper)}.atlas section>h2{font-size:17px}.atlas .frame{box-shadow:none}.atlas .frame.web{width:420px}.atlas .webgrid{grid-template-columns:1fr}.atlas .webside{display:none}body.atlasmode .top,body.atlasmode .workspace{display:none}@media(max-width:800px){.workspace{grid-template-columns:1fr;margin-top:15px;gap:16px}.nav{display:flex;flex-direction:row;overflow:auto}.nav .group,.nav .meta{display:none}.nav button{white-space:nowrap}.top{padding:18px 24px}.frame.web{width:100%}.webgrid{grid-template-columns:1fr}.webside{display:none}.frame{margin:auto}.browserbar,.reviewnote{max-width:420px;margin-left:auto;margin-right:auto}}@media(max-width:430px){.workspace{padding:0 10px}.body{padding:16px}.panelhead{padding:16px}.top p{font-size:12px}}
.desktopscene{width:980px;max-width:none;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.desktopbar{height:48px;background:#edf0e9;display:flex;align-items:center;gap:20px;padding:10px 18px;font-size:12px}.address{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 14px;color:var(--muted)}.desktopcols{display:grid;grid-template-columns:1fr 420px;align-items:start}.watchpage{padding:24px}.watchbrand{font-size:13px;font-weight:600;margin-bottom:20px}.player{height:285px;background:#e6e9e0;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid #d6dbcf;position:relative}.playmark{font-size:42px;color:#839276}.timeline{position:absolute;bottom:12px;font-size:12px;color:#6d7868}.desktopcols .frame{border-radius:0;border:0;border-left:1px solid var(--line);box-shadow:none;min-height:780px}.stage:has(.desktopscene){overflow-x:auto}.workspace:has(.desktopscene){max-width:1330px;grid-template-columns:200px 1fr;gap:24px}.reviewnote{max-width:980px}.browserbar:has(+ #screen .desktopscene){max-width:none} @media(max-width:800px){.workspace:has(.desktopscene){grid-template-columns:1fr}.desktopscene{max-width:none}.stage{overflow-x:auto}} </style></head><body>
<header class="top"><div class="eyebrow">STASHSEEK / PRD v0.10</div><h1>搜藏助手 · 页面与交互原型</h1><p>桌面浏览器插件 · 低保真原型 · 示例数据，不连接真实服务</p></header>
<div class="workspace"><aside><nav class="nav" id="nav" aria-label="原型页面"></nav><div class="meta">观察问题<br>收藏是否省事？候选是否易辨认？<br>自动待看是否可控？<br><br><button onclick="reset()">重置示例状态</button></div></aside><main class="stage"><div class="browserbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>浏览器插件侧栏 / 420 px</span></div><div id="screen" aria-live="polite"></div><div id="note" class="reviewnote"></div></main></div>
<script>
// Throwaway PRD prototype. One faithful flow, not production or a live service.
const pages=[['watchmovie','D01 · 桌面观看电影解说','桌面电影场景'],['movieprocessing','D02 · 收藏后AI分析'],['movieanalyzed','D03 · 分类分析与待看结果'],['entry','P00 · 未登录与登录','开始'],['empty','P01a · 空视频库'],['home','P01 · 插件视频库'],['processing','P01b · 收藏与整理'],['failed','P01c · 处理失败'],['results','P02 · 找回结果','查找'],['noresults','P02a · 没找到'],['detail','P04 · 视频详情'],['edit','P04a · 修改分类'],['movies','P03 · 电影待看','整理'],['uncertain','P03a · 片名待确认'],['movie','P03b · 电影与来源'],['settings','P05 · 设置与控制','管理'],['delete','P05a · 删除确认'],['unsupported','P01d · 非支持页面'],['web','P06 · Web资料库'],['add','P06a · 添加已有链接'],['trash','P06b · 回收站'],['data','P06c · 数据管理']];
const state={desktop:false,filmSaved:false,signed:false,saved:false,auto:true,seen:false,removed:false,confirmed:false,category:'知识 / 观点',deleted:false,query:'',excluded:false,context:false};
let page=new URLSearchParams(location.search).get('screen')||'watchmovie',last='home',pending=false;
const titles={watchmovie:'4.2 / 4.8 · 桌面端观看视频时点击插件收藏，收藏后才开始AI辅助分类与分析。',movieprocessing:'4.3 / 4.8 · 原视频持续保留在左侧，AI在右侧后台处理。',movieanalyzed:'4.7 / 4.8 · 视频归类、内容分析、识别对象与用途清单分别呈现。',entry:'4.1 · 仅模拟登录，不会发送验证码。',empty:'4.1 / 4.4 · 私人空库与已有链接入口。',home:'4.2 / 4.4 · 当前视频快捷卡固定在导航前。',processing:'4.3 · 可手动切换成功或失败，关闭再开不丢状态。',failed:'4.3 · 链接已保留，正文未可用；失败不等于未收藏。',results:'4.5 · 示例检索，不是真实语义搜索。补线索、排除和上下文可点。',noresults:'4.5 · 与网络错误区分，保留当前查询。',detail:'4.6 · 原文、AI整理、用户备注分区。',edit:'4.7 · 修改后在示例详情中同步。',movies:'4.8 · 已自动加入；撤销与已看状态可操作。',uncertain:'4.8 · 同名作品不自动认定，选定版本后加入。',movie:'4.8 · 一个电影对象关联多个来源。',settings:'4.9 · 开关仅影响当前演示。',delete:'4.9 · 删除视频与删除电影清单项分开。',unsupported:'4.2 · 非支持页面仍可查个人库。',web:'4.4 / 4.9 · 与插件共享概念，扩展管理能力。',add:'4.4 · 仅模拟保存，不抓取链接。',trash:'4.9 · 演示恢复，保留期需现状核验。',data:'4.9 · 演示控制入口，不提交真实注销。'};
const btn=(label,action,kind='')=>`<button type="button" class="${kind}" onclick="${action}">${label}</button>`;
const panelHeader=()=>`<div class="panelhead"><div class="brand"><span class="logo">S</span>搜藏助手</div>${btn('设置',"go('settings')",'quiet')}</div>`;
const badge=(t)=>`<span class="tag">${t}</span>`;
function current(mode='ready'){if(state.desktop&&mode!=='unsupported')return filmCurrent();let body=mode==='unsupported'?`<div class="status warn">当前页面暂不支持收藏。你仍可查找个人收藏。</div>`:`<div class="current"><div class="eyebrow">当前视频 · YOUTUBE</div><h3 style="margin-top:6px">如何从访谈中找到真实需求</h3><div class="muted">研究笔记 · 18:42</div><div class="row" style="margin-top:10px">${mode==='processing'?badge('已保存 · 正在整理'):btn(state.saved?'已收藏 · 查看':'收藏到搜藏助手',state.saved?"go('detail')":"save()",'primary')}${btn('写收藏理由',"document.getElementById('reason').hidden=false",'quiet')}</div><div id="reason" hidden><label class="field"><span>为什么收藏（可选）</span><input placeholder="例如：下次做用户访谈时参考"></label></div></div>`;return body}
function tabs(which='library'){return `<div class="tabs">${btn('视频库',"go('home')",which==='library'?'on':'')}${btn('电影待看',"go('movies')",which==='movies'?'on':'')}</div>`}
function search(){return `<form class="search" onsubmit="event.preventDefault(); searchNow(this)"><input name="query" aria-label="找回收藏" placeholder="记得概念、情节或一句话，都可以说" value="${esc(state.query)}"><button class="primary">找回</button></form>`}
function filters(){return `<div class="chips"><select class="chip" aria-label="分类筛选" onchange="toast('已按分类筛选（示例）')"><option>全部分类</option><option>知识 / 观点</option><option>影视</option></select><select class="chip" aria-label="平台筛选" onchange="toast('已按平台筛选（示例）')"><option>全部平台</option><option>YouTube</option><option>B站</option></select><button class="chip" onclick="go('failed')">失败 1</button></div>`}
function video(title,meta,tag='知识 / 观点',film=false){return `<article class="item"><div class="flex start"><div class="thumb ${film?'film':''}">${film?'解说封面':'视频封面'}</div><div class="fill"><h3><button class="quiet" style="padding:0;color:var(--ink);text-align:left" onclick="go('${film?'movie':'detail'}')">${title}</button></h3><div class="muted">${meta}</div>${badge(tag)}</div></div><div class="row actions">${btn('原视频',"source()")}${btn('···',"go('delete')",'quiet')}</div></article>`}
function empty(){return `${current()}${tabs()}${search()}<div class="empty"><div class="symbol">▤</div><h2>把有用的视频先留下</h2><p class="muted">不需要先想分类。整理好了，<br>以后只记得一点也可以找。</p>${btn('收藏当前视频',"save()",'primary')}<p>${btn('添加已有链接',"go('add')",'quiet')}</p></div>`}
function results(){return `${btn('← 视频库',"go('home')",'quiet back')}${search()}<div class="row"><span class="muted">范围：全部可检索收藏 · 示例结果</span>${btn('清除条件',"state.excluded=false;state.query='';render()",'quiet')}</div>${state.excluded?`<div class="status">已排除第1条 ${btn('撤销',"state.excluded=false;render()",'quiet')}</div>`:`<article class="item"><div class="flex start"><div class="thumb">视频封面</div><div><h3><button type="button" class="quiet" style="padding:0;color:var(--ink);text-align:left" onclick="go('detail')">损失厌恶如何影响用户决策</button></h3><div class="muted">认知笔记 · YouTube · 10月12日收藏</div></div></div><p class="small">匹配原因 <span class="muted">· AI归纳</span><br>讨论了损失厌恶与产品决策中的具体例子。</p><div class="evidence"><span class="eyebrow">字幕原文 · 示例</span><p>“人们对失去的感受，往往比获得更强烈。”</p>${state.context?'<p class="muted">上文：假设你正在比较两种方案。<br>下文：这会影响我们对风险的判断。</p>':''}</div><div class="actions">${btn('06:12 回原视频',"source()",'primary')}${btn(state.context?'收起上下文':'查看上下文',"state.context=!state.context;render()")}${btn('不是这条',"state.excluded=true;render()",'quiet')}</div></article>`}${video('行为决策中的常见偏差','决策实验室 · B站 · 10月9日收藏')}<label class="field"><span>还记得什么？</span><input id="clue" placeholder="例如：是B站，讲过一个购物的例子"></label>${btn('补充线索继续找',"state.query=(state.query||'损失厌恶')+' '+document.getElementById('clue').value;toast('已带上补充线索重新查找（示例）');render()",'primary')}<p>${btn('展开更多结果',"toast('已展示当前演示的全部候选')",'quiet')}</p>`}
function movies(){return `${tabs('movies')}<div class="status">${state.auto?'会自动整理明确的主要电影。':'自动加入已关闭，识别后由你选择加入。'}${btn('管理规则',"go('settings')",'quiet')}</div><div class="chips">${btn('待看',"state.seen=false;render()",'chip '+(!state.seen?'active':''))}${btn('已看',"state.seen=true;render()",'chip '+(state.seen?'active':''))}${btn('待确认 1',"go('uncertain')",'chip')}</div>${state.removed?`<div class="empty"><h2>已移出待看</h2><p class="muted">原解说仍在视频库，不会因重新整理再次加入。</p>${btn('重新加入',"state.removed=false;render()",'primary')}</div>`:`<div class="item"><div class="flex start"><div class="poster">电影封面</div><div><h3>记忆回廊</h3><p class="muted">2024 · 示例电影</p>${badge(state.seen?'已看':'待看')}<p class="muted">来源：2条解说</p></div></div><div class="actions">${btn('查看电影与来源',"go('movie')",'primary')}${btn(state.seen?'改为待看':'标记已看',"state.seen=!state.seen;render()")}${btn('移出',"state.removed=true;render()",'quiet')}</div></div><div class="status">${state.auto?'已自动加入电影待看':'已加入电影待看'} ${btn('撤销',"state.removed=true;render()",'quiet')}</div>`}<div class="item"><h3>另一部电影 · 身份待确认</h3><p class="muted">存在同名作品，尚未自动加入待看。</p>${btn('确认版本',"go('uncertain')")}</div>`}
function content(key){switch(key){
case'watchmovie':return filmCurrent()+'<h2>边看视频，边留下线索</h2><p class="muted">点击插件里的收藏，AI会在后台分类、分析并识别主要电影。</p><div class="status">仅处理你主动收藏的视频，不记录全部观看历史。</div>'+tabs()+search();
case'movieprocessing':return filmCurrent()+'<h2>已保存，AI正在辅助整理</h2><p class="muted">继续看视频即可，不必等在这里。</p><div class="selection">✓ 保存原视频</div><div class="selection">◌ 读取可用字幕与内容</div><div class="selection muted">○ 分类主题 → 内容分析 → 电影识别</div><div class="notebar">演示状态控制</div><div class="actions">'+btn('模拟分析完成',"finishFilm()",'primary')+btn('模拟识别有歧义',"go('uncertain')")+btn('模拟解析失败',"go('failed')")+'</div>';
case'movieanalyzed':return filmCurrent()+'<div class="status">AI整理完成 · 原视频已进入视频库</div><div class="eyebrow">自动分类</div><div class="chips"><span class="chip active">影视</span><span class="chip">电影解说</span><span class="chip">记忆主题</span></div><div class="eyebrow">内容分析 · AI整理示例</div><p>本视频围绕一部电影的故事展开，主要讨论人物如何面对记忆与选择。</p><hr class="line"><div class="eyebrow">识别出的主要电影</div><h2>记忆回廊 <span class="muted">2024 · 示例</span></h2><div class="evidence">识别依据：视频标题及字幕中明确提及片名与年份。</div><div class="status">'+(state.removed?'已撤销自动待看':state.auto?'已自动加入电影待看':'自动加入已关闭，可选择加入')+'</div><div class="actions">'+btn('查看电影待看',"go('movies')",'primary')+(state.auto?btn('撤销自动加入',"state.removed=true;render()") : btn('加入待看',"state.removed=false;go('movies')"))+btn('识别有误',"go('uncertain')",'quiet')+'</div><p class="muted">分类是整理原视频；待看清单管理识别出的电影，两者保留关联。</p>';

case'web':return `<div class="webnav row"><div class="brand"><span class="logo">S</span>搜藏助手 / 完整资料库</div>${btn('添加视频',"go('add')",'primary')}</div><div class="webgrid"><div class="webside">${btn('全部收藏',"go('web')")}${btn('电影待看',"go('movies')")}${btn('整理失败',"go('failed')")}${btn('回收站',"go('trash')")}${btn('数据管理',"go('data')")}</div><div class="webmain"><h2>全部收藏</h2>${search()}${filters()}${state.deleted?'':video('如何从访谈中找到真实需求','研究笔记 · YouTube',state.category)}${video('记忆回廊：一段关于时间的故事','电影手记 · B站','影视',true)}<div class="status">与插件使用同一资料库。此页是管理布局示意。</div></div></div>`;

 default:return empty();}}

function filmCurrent(){return '<div class="current"><div class="eyebrow">正在观看 · B站 / 当前分P</div><h3>记忆回廊：一段关于时间的故事</h3><p class="muted">电影手记 · 电影解说 · 示例</p><div class="actions">'+btn(state.filmSaved?'已收藏 · 查看分析':'收藏当前视频',state.filmSaved?"go('movieanalyzed')":"saveFilm()",'primary')+'</div></div>';}
function saveFilm(){state.filmSaved=true;go('movieprocessing')}
function finishFilm(){state.removed=!state.auto;go('movieanalyzed')}
function desktopWrap(key){return '<div class="desktopscene"><div class="desktopbar"><span>● ● ●</span><span class="address">桌面浏览器 · B站视频页面（示意）</span><b>插件已打开</b></div><div class="desktopcols"><div class="watchpage"><div class="watchbrand">B站 / 视频观看页 · 示意</div><div class="player"><div class="playmark">▷</div><div>电影解说视频画面</div><div class="muted">示例画面，不播放真实内容</div><div class="timeline">02:36 ━━━━━━━━━━ 12:48</div></div><h2>记忆回廊：一段关于时间的故事</h2><p>电影手记　·　当前正在观看</p><div class="status">先在原页面观看 → 点击右侧插件收藏 → AI辅助分类与分析</div><p class="muted">原视频仍保留在页面中。插件不是手机App，也不要求先进入电影清单再收藏。</p></div><div class="frame">'+panelHeader()+'<div class="body">'+content(key)+'</div></div></div></div>';}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wrap(key){if(['watchmovie','movieprocessing','movieanalyzed'].includes(key)||state.desktop)return desktopWrap(key);return `<div class="frame ${key==='web'?'web':''}">${key==='web'?'':panelHeader()}<div class="${key==='web'?'':'body'}">${content(key)}</div></div>`}
function render(){document.getElementById('nav').innerHTML=pages.map(([id,label,g])=>`${g?`<div class="group">${g}</div>`:''}<button class="${id===page?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.getElementById('screen').innerHTML=wrap(page);document.getElementById('note').textContent=titles[page]||'';}
function go(k){if(['movieprocessing','movieanalyzed'].includes(k))state.filmSaved=true;if(['watchmovie','movieprocessing','movieanalyzed'].includes(k))state.desktop=true;if(k==='results'&&!state.query)state.query='之前那个讲损失厌恶的视频';if(k==='detail'&&page==='results')state.selected='loss';else if(k==='detail'&&!['edit','detail'].includes(page))state.selected='interview';if(!pages.some(x=>x[0]===k))return;last=page;page=k;history.replaceState(null,'','?screen='+k);render()}
function reset(){Object.assign(state,{desktop:false,filmSaved:false,saved:false,auto:true,seen:false,removed:false,confirmed:false,category:'知识 / 观点',deleted:false,query:'',excluded:false,context:false});go('home')}
function save(){state.saved=true;go('processing')}
function searchNow(form){state.query=form.query.value.trim();state.excluded=false;go(state.query.includes('没有')?'noresults':'results')}
function source(){toast('原型回源示意：正式产品在原平台打开视频或对应时间点。')}
let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3500)}
function addLinks(){const ls=document.getElementById('links').value.split('\n').filter(x=>x.trim());document.getElementById('addResult').innerHTML=ls.length===0?'<div class="status error">请先输入链接。</div>':ls.length>10?'<div class="status error">每次最多10条。</div>':`<div class="status">已模拟保存 ${ls.length} 条链接，等待整理。</div>`;}
function exportDemo(){const blob=new Blob([JSON.stringify({prototype:true,library:[{title:'示例收藏',category:state.category}],movies:[{title:'记忆回廊',status:state.seen?'已看':'待看'}]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stashseek-demo-export.json';a.click();URL.revokeObjectURL(a.href)}
if(['watchmovie','movieprocessing','movieanalyzed'].includes(page))state.desktop=true;if(['movieprocessing','movieanalyzed'].includes(page))state.filmSaved=true;
render();
if(new URLSearchParams(location.search).has('atlas')){document.body.classList.add('atlasmode');const a=document.createElement('div');a.className='atlas';a.innerHTML=pages.map(([k,l])=>`<section><h2>${l}</h2>${wrap(k)}</section>`).join('');document.body.append(a)}
</script></body></html>
