name: Extension and API contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-extension-gates:
    runs-on: ubuntu-latest
    env:
      STASHSEEK_LOG_RETRIEVAL_CONTENT: "false"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql+psycopg://postgres:test@127.0.0.1:5432/kb"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      STASHSEEK_ENV: "development"
      WEB_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension
      - name: Backend contract tests
        run: .venv/bin/python -m pytest -q tests/test_extension_auth.py tests/test_browser_companion_api.py tests/test_web_api_runtime.py tests/test_web_api_app.py tests/test_mcp_server.py
      - name: Alembic graph
        run: .venv/bin/alembic heads
      - name: OpenAPI contract
        run: pnpm check:api
        working-directory: extension
      - name: Extension checks
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm run audit
        working-directory: extension

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deterministic-extension-gates
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://stashseek.deequoique.tech
    concurrency:
      group: stashseek-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Configure restricted SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          install -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/stashseek-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy approved main revision
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/stashseek-production" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
