name: Web auth contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-web-gates:
    runs-on: ubuntu-latest
    env:
      STASHSEEK_LOG_RETRIEVAL_CONTENT: "false"
      PYTHONUNBUFFERED: "1"
      # Focused Web/Auth/MCP tests use SQLite fixtures and never need a real
      # Postgres password, Redis endpoint, model key, or email credential.
      # Point integration probes at an unreachable loopback DSN so Settings
      # has a complete shape and PostgreSQL-only tests skip cleanly; no real
      # password or database is contacted by this deterministic gate.
      DATABASE_URL: "postgresql+psycopg://postgres:test@127.0.0.1:5432/kb"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      STASHSEEK_ENV: "development"
      WEB_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Focused Web/Auth backend tests
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_web_api.py tests/test_web_api_public.py
          tests/test_web_api_runtime.py tests/test_web_api_app.py
          tests/test_web_api_auth.py tests/test_web_auth.py
          tests/test_web_auth_migration.py tests/test_web_email_auth.py
          tests/test_multiuser_integration.py
          tests/test_mcp_server.py
      - name: Alembic graph
        run: .venv/bin/alembic heads
      - name: Check generated browser contract
        run: pnpm check:api
        working-directory: web
      - name: Lint
        run: pnpm lint
        working-directory: web
      - name: Typecheck
        run: pnpm typecheck
        working-directory: web
      - name: Frontend tests
        run: pnpm test
        working-directory: web
      - name: Production build
        run: pnpm build
        working-directory: web

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deterministic-web-gates
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://notebookai.deequoique.tech
    concurrency:
      group: stashseek-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Configure restricted SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          install -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/stashseek-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy approved main revision
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -eu
          ssh \
            -i "$HOME/.ssh/stashseek-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA"
