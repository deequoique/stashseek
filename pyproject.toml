[project]
name = "stashseek"
version = "0.1.0"
description = "StashSeek Chat：在你收藏过的内容中直接对话并找回来源视频"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "redis==8.1.0",
    "celery==5.6.3",
    "boto3==1.43.63",
    "python-dotenv==1.2.2",
    "certifi>=2025,<2027",
    "yt-dlp[default,curl-cffi]>=2026.7,<2026.9",
    "prometheus-client>=0.22,<1",
    "pydantic-ai-slim[openai]==2.15.0",
    "mcp==2.0.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=1.3,<2",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
"evals.natural_language" = ["catalog.yaml", "README.md"]
"evals.video_recognition" = ["catalog.yaml", "pilot_catalog.yaml", "probe_snapshot.yaml", "README.md", "fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
